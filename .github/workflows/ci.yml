name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Safety benchmark gate
        run: execuseal test benchmarks/v0.1.jsonl --minimum-score 80

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: execuseal_test
          POSTGRES_USER: execuseal
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U execuseal -d execuseal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      EXECUSEAL_TEST_POSTGRES_URL: postgresql+psycopg://execuseal:integration-test-only@localhost:5432/execuseal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_postgres.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          EXECUSEAL_API_KEYS: ci-validation-key-not-for-production
          POSTGRES_PASSWORD: ci-validation-password
        run: docker compose config --quiet
      - name: Build hardened image
        run: docker build --tag execuseal:ci .
