name: Bug report
description: Report a reproducible non-security defect using synthetic data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not submit vulnerabilities, credentials, personal data, customer data, or private prompts. Security reports belong in GitHub private vulnerability reporting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, operating system, and database
  - type: checkboxes
    id: safety
    attributes:
      label: Safe submission confirmation
      options:
        - label: I used only synthetic or fully redacted data.
          required: true
        - label: This report does not describe a security vulnerability or bypass.
          required: true
